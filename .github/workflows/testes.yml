name: Testes

on:
  push:
    branches: [main, feature/robustez-documental-v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Testes offline
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # os arquivos do repositório usam LF; sem isto o checkout no Windows converte para CRLF
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes offline (sem PJe-Calc)
        run: node scripts/test-mcp.mjs
      - name: Testes de contingencia (offline)
        run: node scripts/test-contingencia.mjs

      - name: Testes de leitura documental (offline)
        run: node scripts/test-leitura-documental.mjs
